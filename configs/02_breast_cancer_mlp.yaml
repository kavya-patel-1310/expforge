# Neural net trained epoch-by-epoch with early stopping -> learning curves in the dashboard
experiment: breast-cancer-diagnosis
name: mlp-64x32-early-stop
dataset: {name: breast_cancer, seed: 42}
model:
  name: mlp
  params: {hidden_layer_sizes: [64, 32], learning_rate_init: 0.001, alpha: 0.001}
training: {scale: true, epochs: 120, early_stopping_patience: 10}
tags: {owner: ml-team, stage: candidate}
