[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "expforge"
version = "1.0.0"
description = "ML experimentation platform: experiment tracking, hyperparameter sweeps, model evaluation, comparison dashboards and a model registry with a prediction API."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mlops", "experiment-tracking", "machine-learning", "model-registry", "hyperparameter-tuning"]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "sqlalchemy>=2.0",
  "pydantic>=2.5",
  "python-multipart>=0.0.9",
  "scikit-learn>=1.3",
  "numpy>=1.24",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "requests>=2.31",
  "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.5"]
postgres = ["psycopg[binary]>=3.1"]

[project.scripts]
expforge = "expforge.cli:main"

[tool.setuptools.packages.find]
include = ["expforge*"]

[tool.setuptools.package-data]
expforge = ["static/*", "static/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::sklearn.exceptions.ConvergenceWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
